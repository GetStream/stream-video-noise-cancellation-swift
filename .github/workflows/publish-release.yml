name: "Publish new release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Provide release version'
        type: string
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Publish new release
    runs-on: macos-15
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ios-certificates,stream-video-noise-cancellation-swift-private
      - name: Connect Bot
        # Send SSH git URLs (match, private sources) over HTTPS with the token.
        run: >-
          git config --global
          url."https://x-access-token:${TOKEN}@github.com/GetStream/".insteadOf
          "git@github.com:GetStream/"
        env:
          TOKEN: ${{ steps.bot-token.outputs.token }}
      - uses: actions/checkout@v4.1.1
      - name: Extract version from branch name (for release branches)
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
            VERSION=${BRANCH_NAME#release/}
            echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          fi
      - uses: ./.github/actions/ruby-cache
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IOS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.IOS_RELEASE_BOT_PRIVATE_KEY }}
      - name: "Fastlane - Publish Release"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: bundle exec fastlane publish_release version:${{ env.RELEASE_VERSION }} --verbose
